<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Youtube Channel</title>
  </head>
  <body>
    <button id="btn">change video</button>
    <h1 id="title"></h1>
    <p id="content"></p>
    <iframe
      id="video"
      width="500"
      height="300"
      src="about:blank"
      style="border: 0;"
      allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen>
    </iframe>
    <style>
      #btn {
        padding: .8rem 2rem;
        text-align: center;
        border-radius: 5px;
        border: none;
        background: rgba(127, 136, 182, 1);
        color: white;
        cursor: pointer;
      }
    </style>
    <script src="javascripts/ajax_sample.js" type="text/javascript"></script>
  </body>
</html>
